<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>SmartQuiz — Take Quiz</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="css/style.css" />
    <meta name="robots" content="noindex" />
  </head>
  <body
    class="text-white min-h-screen flex flex-col selection:bg-purple-500/30 font-sans"
  >
    <div class="fixed top-0 left-0 w-full h-1.5 bg-gray-800 z-50">
      <div
        id="progress-fill"
        class="h-full bg-purple-600 shadow-[0_0_10px_rgba(147,51,234,0.5)] transition-all duration-500 ease-out"
        style="width: 0%"
      ></div>
    </div>

    <header
      class="w-full max-w-4xl mx-auto p-6 flex items-center justify-between"
    >
      <div class="flex items-center gap-3 text-gray-400">
        <a
          href="dashboard.html"
          class="hover:text-white transition flex items-center gap-1 group"
        >
          <ion-icon
            name="arrow-back"
            class="group-hover:-translate-x-1 transition"
          ></ion-icon>
          Exit
        </a>
        <span class="w-1 h-1 bg-gray-600 rounded-full"></span>
        <span
          id="quiz-title"
          class="text-white font-medium truncate max-w-[200px] md:max-w-md"
          >Loading...</span
        >
      </div>
      <div id="quiz-meta" class="text-xs text-gray-500 hidden md:block"></div>
    </header>

    <main class="flex-grow flex items-center justify-center px-4 pb-20">
      <div id="quiz-content-area" class="w-full max-w-2xl">
        <div class="animate-pulse flex flex-col gap-4">
          <div class="h-8 bg-[#11121E] rounded w-1/3"></div>
          <div
            class="h-32 bg-[#11121E] rounded-xl border border-gray-800"
          ></div>
          <div
            class="h-16 bg-[#11121E] rounded-xl border border-gray-800"
          ></div>
          <div
            class="h-16 bg-[#11121E] rounded-xl border border-gray-800"
          ></div>
        </div>
      </div>
    </main>

    <!-- Ionicons Script -->
    <script
      type="module"
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"
    ></script>

    <script>
      window.SMARTQUIZ_BUILD_VERSION =
        window.SMARTQUIZ_BUILD_VERSION || "2025-11-14-a";
    </script>
    <script type="module" src="js/auth.js?v=2025-11-14-a"></script>
    <script type="module" src="js/quiz-taker.js?v=2025-11-14-a"></script>
  </body>
</html>
