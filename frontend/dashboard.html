<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SmartQuiz — Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <meta name="robots" content="noindex">
</head>
<body class="dashboard-layout">
    <header class="hero">
        <div>
            <p class="eyebrow">SmartQuiz — Dashboard</p>
            <h1>Dashboard</h1>
            <p id="user-welcome">Checking authentication…</p>
        </div>
        <div class="hero-actions">
            <button id="signout-btn" class="ghost" style="display:none;">Log Out</button>
        </div>
    </header>

    <main>
        <section class="card">
            <h2>Your Quiz Content</h2>
            <p>This area is protected. Once authenticated, we'll stream quiz data here.</p>
            <div id="quiz-content-placeholder" class="placeholder">
                <p><em>Quiz content will appear here after you log in.</em></p>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 SmartQuiz</p>
    </footer>

    <script>
        window.SMARTQUIZ_BUILD_VERSION = window.SMARTQUIZ_BUILD_VERSION || '2025-11-14-a';
    </script>
    <script type="module" src="js/auth.js?v=2025-11-14-a"></script>
</body>
</html>
